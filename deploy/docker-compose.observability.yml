# Athena 可选可观测性后端：Langfuse（含 pgvector）。
#
# 本文件用于"把内置可观测性升级为完整 Langfuse 平台"的场景，非必选：
# 内置 obs 层已将 span 契约收敛，迁移时只需把 app/obs.py 的写入转发到这里。
# 启动：docker compose -f deploy/docker-compose.observability.yml up -d
# 本机无此需求可忽略本文件，项目不依赖它。
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: athena
      POSTGRES_PASSWORD: athena_dev
      POSTGRES_DB: athena
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U athena"]
      interval: 5s
      timeout: 5s
      retries: 10

  langfuse:
    image: langfuse/langfuse:latest
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://athena:athena_dev@postgres:5432/athena
      NEXTAUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: change-me-please
      SALT: change-me-too
      ENCRYPTION_KEY: change-me-three
      OTEL_EXPORTER_OTLP_ENABLED: "false"
    ports:
      - "3000:3000"

volumes:
  pgdata: