# 生产覆盖配置：与根目录开发 Compose 叠加使用。
#
# 用法（先在根目录 .env 或当前 shell 设置下列变量）：
#   docker compose -f docker-compose.yml -f deploy/docker-compose.production.yml up -d --build
#
# 该文件不会自动创建或删除数据库卷。已有卷中的 PostgreSQL 用户/密码不会因修改环境变量而
# 变更；切换凭据前请按运维流程完成数据库用户、权限和备份迁移。
services:
  db:
    environment:
      POSTGRES_USER: "${ATHENA_DB_USER:?set ATHENA_DB_USER}"
      POSTGRES_PASSWORD: "${ATHENA_DB_PASSWORD:?set ATHENA_DB_PASSWORD}"
      POSTGRES_DB: "${ATHENA_DB_NAME:?set ATHENA_DB_NAME}"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
    # 生产数据库只通过 Compose 内网访问，不映射到宿主机。
    ports: !reset []

  api:
    environment:
      ATHENA_ENVIRONMENT: production
      ATHENA_API_KEY: "${ATHENA_API_KEY:?set ATHENA_API_KEY}"
      ATHENA_CORS_ALLOWED_ORIGINS: "${ATHENA_CORS_ALLOWED_ORIGINS:?set ATHENA_CORS_ALLOWED_ORIGINS}"
      ATHENA_ALLOWED_HOSTS: "${ATHENA_ALLOWED_HOSTS:?set ATHENA_ALLOWED_HOSTS}"
      ATHENA_PG_DSN: "${ATHENA_PG_DSN:?set ATHENA_PG_DSN}"
      ATHENA_LLM_BASE_URL: "${ATHENA_LLM_BASE_URL:?set ATHENA_LLM_BASE_URL}"
      ATHENA_LLM_API_KEY: "${ATHENA_LLM_API_KEY:?set ATHENA_LLM_API_KEY}"
      ATHENA_LLM_MODEL: "${ATHENA_LLM_MODEL:?set ATHENA_LLM_MODEL}"
      ATHENA_MOCK_FORCE: "false"
      ATHENA_DOC_ROOT: ""

  web:
    environment:
      ATHENA_API_KEY: "${ATHENA_API_KEY:?set ATHENA_API_KEY}"
