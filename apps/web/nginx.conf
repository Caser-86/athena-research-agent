# Nginx 反代：托管静态前端，/api 与 /health 转发到 API 服务（同源，规避 CORS）
#
# 说明：proxy_pass 使用 Docker 内置 DNS（127.0.0.11）做动态解析，避免 nginx
# 在启动时因 api 容器 DNS 尚未就绪而静态解析失败（host not found）导致崩溃。
resolver 127.0.0.11 valid=30s ipv6=off;

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 静态页
    location / {
        try_files $uri $uri/ /index.html;
        # 单页应用页面文件不缓存，避免浏览器复用旧 HTML
        add_header Cache-Control "no-store";
    }

    # API 反向代理（含 SSE 流式；关闭缓冲以实时推送）
    location /api/ {
        set $api_upstream http://api:8000;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;          # SSE 需要实时推送
        proxy_cache off;
        proxy_read_timeout 600s;      # 研究报告长任务
    }

    location = /health {
        set $health_upstream http://api:8000/health;
        proxy_pass $health_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }
}