# Nginx 反代：托管静态前端，/api 与 /health 转发到 API 服务（同源，规避 CORS）
#
# 说明：proxy_pass 使用 Docker 内置 DNS（127.0.0.11）做动态解析，避免 nginx
# 在启动时因 api 容器 DNS 尚未就绪而静态解析失败（host not found）导致崩溃。
resolver 127.0.0.11 valid=30s ipv6=off;

# 仅限制会触发模型编排的入口；轮询队列、历史和观测接口不消耗该配额。
limit_req_zone $binary_remote_addr zone=athena_research:10m rate=6r/m;

server {
    listen 80;
    server_name _;
    # 研究问题本身由 API schema 限制为 2000 字符；代理层拒绝异常大的请求体。
    client_max_body_size 256k;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-UyzbubvaYZjmlReyCG+oht34+kx1NvZkC4nDnXgerzw='; style-src 'self' 'sha256-scAMKX9q39jiWbCqXPjGQo12fkHXtqSHb0L4EkvoIqY='; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;

    root /usr/share/nginx/html;
    index index.html;

    # 静态页
    location / {
        try_files $uri $uri/ /index.html;
        # 单页应用页面文件不缓存，避免浏览器复用旧 HTML
        add_header Cache-Control "no-store";
    }

    # API 反向代理（含 SSE 流式；关闭缓冲以实时推送）
    location /api/ {
        set $api_upstream http://api:8000;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # API Key 只在 Nginx 服务端注入，不进入浏览器、URL 或前端脚本。
        proxy_set_header X-API-Key "${ATHENA_API_KEY}";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;          # SSE 需要实时推送
        proxy_cache off;
        proxy_read_timeout 600s;      # 研究报告长任务
    }

    # 防止重复点击 / 重放请求导致模型费用和队列资源失控。
    location ~ ^/api/research/(run|stream)$ {
        limit_req zone=athena_research burst=2 nodelay;
        set $api_upstream http://api:8000;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-API-Key "${ATHENA_API_KEY}";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
    }

    location = /health {
        set $health_upstream http://api:8000/health;
        proxy_pass $health_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }
}
